<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>박사학위 콘솔</title>
<meta name="description" content="공공정책학 박사 프로포절 36주 실행 콘솔 — 주차별 과제, 투입 시간, 매달 규율을 한 곳에서 추적합니다.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23146B63'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Georgia,serif' fill='%23fff' text-anchor='middle'%3E%E5%8D%9A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
/* 화면 테마: 기본은 밝게. 운영체제 다크 모드를 자동으로 따르지 않고, 상단 바 버튼으로만 바꾼다 */
(function(){ var t = "light"; try{ t = localStorage.getItem("phd-console-theme") || "light"; }catch(e){}
  document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light"); })();
</script>
<style>
:root{
  --ground:#EFF2F0; --surface:#FFFFFF; --surface-2:#E7ECE9; --surface-3:#DAE1DD;
  --line:#D6DDD9; --line-soft:#E4EAE6; --line-strong:#B0BCB6;
  --ink:#121B19; --ink-2:#4E5A55; --ink-3:#7B8782;
  --accent:#0F5F58; --accent-ink:#0B4741; --accent-soft:#D3E7E3; --accent-line:#7FBAB2; --on-accent:#FFFFFF;
  --warn:#A84E1A; --warn-soft:#F6E1D1; --warn-line:#DCAC84;
  --grid:#E2E9E5;
  --shadow:0 1px 2px rgba(18,27,25,.05), 0 14px 32px -22px rgba(18,27,25,.35);
  --shadow-lift:0 1px 2px rgba(18,27,25,.06), 0 22px 48px -28px rgba(18,27,25,.45);
  --r-s:7px; --r-m:11px; --r-l:18px;
  --f-display:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  --f-body:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  --f-mono:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  --t-hero:clamp(30px,5.2vw,40px); --t-xl:21px; --t-l:16.5px; --t-m:14px;
  --t-s:12.5px; --t-xs:11.5px; --t-lab:10.5px;
  --rail:216px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0A100F; --surface:#141B19; --surface-2:#1C2523; --surface-3:#26312E;
    --line:#2A3532; --line-soft:#1F2927; --line-strong:#41504B;
    --ink:#E9F0ED; --ink-2:#9BA9A4; --ink-3:#78857F;
    --accent:#63C4B6; --accent-ink:#98DED2; --accent-soft:#11332F; --accent-line:#2F6E65; --on-accent:#05201C;
    --warn:#E39A62; --warn-soft:#3A2519; --warn-line:#77502F;
    --grid:#222C2A;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -22px rgba(0,0,0,.95);
    --shadow-lift:0 1px 2px rgba(0,0,0,.55), 0 26px 56px -30px rgba(0,0,0,1);
  }
}
:root[data-theme="dark"]{
  --ground:#0A100F; --surface:#141B19; --surface-2:#1C2523; --surface-3:#26312E;
  --line:#2A3532; --line-soft:#1F2927; --line-strong:#41504B;
  --ink:#E9F0ED; --ink-2:#9BA9A4; --ink-3:#78857F;
  --accent:#63C4B6; --accent-ink:#98DED2; --accent-soft:#11332F; --accent-line:#2F6E65; --on-accent:#05201C;
  --warn:#E39A62; --warn-soft:#3A2519; --warn-line:#77502F;
  --grid:#222C2A;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -22px rgba(0,0,0,.95);
  --shadow-lift:0 1px 2px rgba(0,0,0,.55), 0 26px 56px -30px rgba(0,0,0,1);
}

*{box-sizing:border-box}
html,body{margin:0; padding:0}
body{background:var(--ground); color:var(--ink); font-family:var(--f-body); font-size:var(--t-m); line-height:1.6; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
h1,h2,h3{margin:0; text-wrap:balance; font-family:var(--f-display); font-weight:700; letter-spacing:-.02em}
p{margin:0}
.eyebrow{font-size:var(--t-lab); font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
a{color:var(--accent)}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

/* ============ 앱 셸 ============ */
.app{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); min-height:100vh}
.rail{position:sticky; top:0; height:100vh; border-right:1px solid var(--line); background:var(--surface);
  display:flex; flex-direction:column; gap:3px; padding:20px 12px}
.logo{display:flex; flex-direction:column; gap:3px; padding:4px 10px 18px}
.logo b{font-family:var(--f-display); font-size:19px; font-weight:700; letter-spacing:-.025em; line-height:1.2}
.logo span{font-size:10px; color:var(--ink-3); font-family:var(--f-mono); letter-spacing:.1em; text-transform:uppercase}
.navb{position:relative; display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:var(--r-s);
  font-size:13.5px; font-weight:500; color:var(--ink-2); text-align:left; width:100%;
  transition:background .14s ease, color .14s ease}
.navb:hover{background:var(--surface-2); color:var(--ink)}
.navb svg{width:18px; height:18px; flex:none; stroke:currentColor; fill:none; stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round; opacity:.85}
.navb[aria-current="page"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.navb[aria-current="page"] svg{opacity:1}
.navb[aria-current="page"]::before{content:""; position:absolute; left:-12px; top:9px; bottom:9px; width:3px;
  border-radius:0 3px 3px 0; background:var(--accent)}
.navb .cnt{margin-left:auto; font-family:var(--f-mono); font-size:10px; color:var(--ink-3);
  font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.navb[aria-current="page"] .cnt{color:var(--accent-ink)}
.railfoot{margin-top:auto; display:flex; flex-direction:column; gap:12px; padding:10px 2px 2px}
.railprog{display:flex; flex-direction:column; gap:6px; padding:0 8px}
.railprog .pl{display:flex; justify-content:space-between; font-family:var(--f-mono); font-size:10px;
  color:var(--ink-3); letter-spacing:.04em}
.railprog .pb{height:3px; border-radius:99px; background:var(--surface-3); overflow:hidden}
.railprog .pb i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .4s ease}
.savechip{display:inline-flex; align-items:center; gap:6px; font-size:10.5px; color:var(--ink-3);
  font-family:var(--f-mono); padding:0 8px}
.savechip i{width:5px;height:5px;border-radius:50%;background:var(--accent-line); flex:none}

.col{display:flex; flex-direction:column; min-width:0}
.appbar{position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--ground) 86%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 28px}
.appbar h1{font-family:var(--f-display); font-size:var(--t-xl); font-weight:700; letter-spacing:-.025em}
.appbar .meta{font-family:var(--f-mono); font-size:11px; color:var(--ink-3); text-align:right; line-height:1.5;
  font-variant-numeric:tabular-nums; letter-spacing:.01em}
main{padding:24px 28px 56px; display:flex; flex-direction:column; gap:20px; max-width:1080px}
@media (prefers-reduced-motion: no-preference){
  main > *{animation:rise .26s ease both}
  @keyframes rise{from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:none}}
}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed; bottom:0; left:0; right:0; top:auto; height:auto; z-index:20;
    flex-direction:row; border-right:none; border-top:1px solid var(--line); padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .logo,.railfoot{display:none}
  .navb{flex-direction:column; gap:3px; font-size:10.5px; padding:7px 4px; justify-content:center}
  .navb svg{width:20px;height:20px}
  .navb .cnt{display:none}
  .appbar{padding:12px 16px}
  .appbar h1{font-size:17px}
  main{padding:18px 16px 96px}
}

/* ============ 공통 ============ */
/* 기본 패널은 납작하게 — 위계는 히어로와 주요 패널에만 준다 */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l)}
.panel.lift{box-shadow:var(--shadow)}
.panel-hd{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;
  padding:15px 20px; border-bottom:1px solid var(--line-soft)}
.panel-hd h2{font-family:var(--f-display); font-size:var(--t-l); font-weight:600; letter-spacing:-.02em}
.panel-hd .hint{font-size:var(--t-xs); color:var(--ink-3)}
.panel-bd{padding:17px 20px}
.sechd{font-size:var(--t-lab); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:600}

/* ---- 히어로 밴드: 이번 주 + 카운트다운 ---- */
.hero{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:0;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l);
  box-shadow:var(--shadow-lift); overflow:hidden; position:relative}
.hero::before{content:""; position:absolute; inset:0 0 auto 0; height:2px;
  background:linear-gradient(90deg, var(--accent), var(--accent-line) 62%, transparent)}
.hero-main{padding:22px 24px; display:flex; align-items:center; gap:20px; border-right:1px solid var(--line-soft)}
.ring{flex:none; width:74px; height:74px; display:block}
.ring circle{fill:none; stroke-linecap:round}
.ring .trk{stroke:var(--surface-3); stroke-width:7}
.ring .bar{stroke:var(--accent); stroke-width:7; transition:stroke-dasharray .45s ease}
.ring .bar.warnf{stroke:var(--warn)}
.ring text{font-family:var(--f-mono); font-size:19px; font-weight:600; fill:var(--ink);
  text-anchor:middle; letter-spacing:-.04em}
.hero-id{display:flex; flex-direction:column; gap:4px; min-width:0}
.hero-w{font-family:var(--f-mono); font-size:var(--t-hero); font-weight:600; line-height:1;
  letter-spacing:-.045em; color:var(--ink)}
.hero-d{font-family:var(--f-mono); font-size:var(--t-xs); color:var(--ink-2); font-variant-numeric:tabular-nums}
.hero-s{font-size:var(--t-s); color:var(--ink-3)}

.hero-counts{display:grid; grid-template-columns:repeat(3,minmax(0,1fr))}
.cd{padding:20px 18px; display:flex; flex-direction:column; gap:5px; border-left:1px solid var(--line-soft)}
.cd:first-child{border-left:none}
.cd .lab{font-size:var(--t-lab); letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.cd .val{font-family:var(--f-mono); font-size:26px; font-weight:500; line-height:1.05; letter-spacing:-.035em;
  font-variant-numeric:tabular-nums}
.cd .val.accv{color:var(--accent)} .cd .val.warnv{color:var(--warn)}
.cd .note{font-size:11px; color:var(--ink-3); font-family:var(--f-mono); font-variant-numeric:tabular-nums}
@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .hero-main{border-right:none; border-bottom:1px solid var(--line-soft)}
}
@media (max-width:520px){
  .hero-counts{grid-template-columns:1fr 1fr}
  .cd:nth-child(3){grid-column:1 / -1; border-left:none; border-top:1px solid var(--line-soft)}
}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(162px,1fr)); gap:0;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); overflow:hidden}
.tile{padding:16px 18px; display:flex; flex-direction:column; gap:5px; border-left:1px solid var(--line-soft)}
.tile:first-child{border-left:none}
.tile .lab{font-size:var(--t-lab); letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.tile .val{font-family:var(--f-mono); font-size:26px; font-weight:500; line-height:1.05; letter-spacing:-.035em;
  font-variant-numeric:tabular-nums}
.tile .val.accv{color:var(--accent)} .tile .val.warnv{color:var(--warn)}
.tile .note{font-size:11px; color:var(--ink-3); font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.meter{height:3px; border-radius:99px; background:var(--surface-3); overflow:hidden}
.meter i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .35s ease}
.meter i.warnf{background:var(--warn)}
.tile .meter{max-width:104px; margin:3px 0 1px}

.tag{font-size:9.5px; font-weight:600; letter-spacing:.04em; padding:1px 5px; border-radius:3px;
  border:1px solid var(--line-strong); color:var(--ink-2); white-space:nowrap}
.tag.adv{border-color:var(--accent-line); color:var(--accent-ink); background:var(--accent-soft)}
.tag.rest{border-style:dashed}
.tag.key{border-color:var(--warn-line); color:var(--warn); background:var(--warn-soft)}

.abtn{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-s);
  padding:7px 13px; font-size:12.5px; font-weight:500}
.abtn:hover{background:var(--surface-3)}
.abtn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.abtn.primary:hover{filter:brightness(1.08)}
a.abtn{display:inline-flex; align-items:center; gap:7px; text-decoration:none; color:inherit}
a.abtn.primary{color:var(--on-accent)}
.dlrow{display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.dlrow .fname{font-family:var(--f-mono); font-size:11.5px; color:var(--ink-3)}
.actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.msg{font-size:11.5px; color:var(--accent)}

/* 과제 · 체크 */
/* 체크 표시는 브라우저 기본 대신 직접 그린다 — 크기·색·정렬을 통제하기 위해 */
.ck{margin:0; flex:none; width:19px; height:19px; margin-top:1px; cursor:pointer;
  appearance:none; -webkit-appearance:none; border:1.5px solid var(--line-strong); border-radius:5px;
  background:var(--surface); display:grid; place-content:center; transition:background .14s, border-color .14s}
.ck::after{content:""; width:10px; height:6px; border-left:2px solid var(--on-accent);
  border-bottom:2px solid var(--on-accent); transform:rotate(-45deg) scale(.6) translate(1px,-2px);
  opacity:0; transition:opacity .12s ease, transform .14s ease}
.ck:checked{background:var(--accent); border-color:var(--accent)}
.ck:checked::after{opacity:1; transform:rotate(-45deg) scale(1) translate(1px,-2px)}
.ck:hover{border-color:var(--accent-line)}

.tasklist{display:flex; flex-direction:column; gap:1px}
.task{display:flex; align-items:flex-start; gap:11px; padding:9px 10px; border-radius:var(--r-s); cursor:pointer;
  transition:background .12s ease}
.task:hover{background:var(--surface-2)}
.task span{font-size:var(--t-m); line-height:1.5}
.task.on span{color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--line-strong)}
.deliver{display:flex; align-items:center; gap:10px; padding:10px 13px; border-radius:var(--r-s);
  background:var(--surface-2); border-left:3px solid var(--accent)}
.deliver .k{font-size:var(--t-lab); font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); white-space:nowrap}
.deliver .v{font-size:13px; font-weight:500}

.fieldgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:12px}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:10.5px; font-weight:600; letter-spacing:.06em; color:var(--ink-3)}
.numrow{display:flex; align-items:baseline; gap:6px}
input[type="number"], textarea{font-family:inherit; font-size:13.5px; color:var(--ink); background:var(--ground);
  border:1px solid var(--line); border-radius:var(--r-s); padding:7px 9px; width:100%}
input[type="number"]{font-family:var(--f-mono); font-variant-numeric:tabular-nums; max-width:92px; text-align:right}
textarea{resize:vertical; min-height:54px; line-height:1.55}
.numrow .unit{font-family:var(--f-mono); font-size:12px; color:var(--ink-3)}

.hab{display:flex; align-items:flex-start; gap:10px; padding:8px; border-radius:var(--r-s); cursor:pointer;
  transition:background .12s ease}
.hab:hover{background:var(--surface-2)}
.hab .ht{font-size:var(--t-s); font-weight:600; letter-spacing:.01em}
.hab .hw{font-size:var(--t-xs); color:var(--ink-3); line-height:1.5}
.hab.on .ht{color:var(--ink-3)}
.nbtn{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-s);
  width:28px; height:28px; display:grid; place-items:center; font-size:13px; line-height:1}
.nbtn:hover{background:var(--surface-3)}
.nbtn.wide{width:auto; padding:0 10px; font-size:11.5px; font-weight:600}
.mnav{display:flex; align-items:center; gap:6px}
.mnav .cur{font-family:var(--f-mono); font-size:12px; font-weight:600; min-width:62px; text-align:center}

/* 36주 보드 */
.board{display:grid; grid-template-columns:repeat(auto-fit,minmax(248px,1fr)); gap:14px}
.mgroup{display:flex; flex-direction:column; gap:7px}
.mhd{display:flex; align-items:baseline; gap:8px; padding-bottom:5px; border-bottom:1px solid var(--line)}
.mhd .mk{font-family:var(--f-mono); font-size:12px; font-weight:600}
.mhd .ms{font-size:11.5px; color:var(--ink-2)}
.mhd .mc{margin-left:auto; font-family:var(--f-mono); font-size:11px; color:var(--ink-3)}
.wk{display:grid; grid-template-columns:30px 1fr auto; align-items:center; gap:9px; width:100%; text-align:left;
  background:var(--surface-2); border:1px solid transparent; border-radius:var(--r-s); padding:7px 10px;
  transition:background .13s ease, border-color .13s ease}
.wk:hover{background:var(--surface-3)}
.wk .wn{font-family:var(--f-mono); font-size:11.5px; font-weight:600; color:var(--ink-2); letter-spacing:-.03em}
.wk .wd{font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); font-variant-numeric:tabular-nums;
  letter-spacing:-.01em}
.wk .wr{display:flex; align-items:center; gap:6px}
.wk .wfrac{font-family:var(--f-mono); font-size:10px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.wbar{width:24px; height:3px; border-radius:99px; background:var(--line-strong); overflow:hidden; opacity:.5}
.wbar i{display:block; height:100%; background:var(--accent)}
.wk[data-st="done"] .wbar, .wk[data-st="late"] .wbar, .wk[data-st="now"] .wbar{opacity:1}
.wk[data-st="done"]{background:var(--accent-soft)} .wk[data-st="done"] .wn{color:var(--accent-ink)}
.wk[data-st="late"]{background:var(--warn-soft)} .wk[data-st="late"] .wn{color:var(--warn)}
.wk[data-st="late"] .wbar i{background:var(--warn)}
.wk[data-st="now"]{background:var(--surface); border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent)}
.wk[data-st="now"] .wn{color:var(--accent)}
.wk.sel{border-color:var(--ink); box-shadow:inset 3px 0 0 var(--ink)}
.wk[data-st="now"].sel{box-shadow:inset 3px 0 0 var(--accent)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--ink-2); margin-top:10px}
.legend span{display:inline-flex; align-items:center; gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* 차트 */
.chartwrap{position:relative}
.chart{width:100%; height:auto; display:block; overflow:visible}
.chart text{font-family:var(--f-mono); font-size:9.5px; fill:var(--ink-3)}
.chart .axl{fill:var(--ink-2)}
.tip{position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--line-strong);
  border-radius:var(--r-s); padding:6px 9px; font-size:11.5px; box-shadow:var(--shadow); white-space:nowrap;
  transform:translate(-50%,-110%); z-index:3; font-family:var(--f-mono)}

/* 기록 목록 */

/* 표 · 카드 */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-m); background:var(--surface)}

.tl{display:flex; flex-direction:column}

.tlrow .rl::before{content:""; position:absolute; top:7px; bottom:-16px; width:1px; background:var(--line)}

.tlrow .txt{font-size:13px} .tlrow .txt b{font-weight:600}
.tlrow .cd{font-family:var(--f-mono); font-size:11px; color:var(--ink-3); margin-left:6px}


/* ============ 데이터 화면 ============ */
:root{ --seq1:#DCEBE8; --seq2:#A9D2CA; --seq3:#6FB5A9; --seq4:#358E81; --seq5:#0F5F58; --nodata:#E7ECE9 }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --seq1:#153A35; --seq2:#1E5A52; --seq3:#2F8074; --seq4:#4FA99A; --seq5:#8ED3C7; --nodata:#1C2523 } }
:root[data-theme="dark"]{ --seq1:#153A35; --seq2:#1E5A52; --seq3:#2F8074; --seq4:#4FA99A; --seq5:#8ED3C7; --nodata:#1C2523 }
.dgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px}

.heat{display:inline-grid; grid-auto-flow:column; gap:2px; vertical-align:middle}
.heat i{display:block; width:11px; height:14px; border-radius:2px; background:var(--nodata)}
.heat i[data-q="1"]{background:var(--seq1)} .heat i[data-q="2"]{background:var(--seq2)} .heat i[data-q="3"]{background:var(--seq3)}

.pill.ok{border-color:var(--accent-line); color:var(--accent-ink); background:var(--accent-soft)}
.pill.part{border-color:var(--warn-line); color:var(--warn); background:var(--warn-soft)}
.corr{border-collapse:collapse; font-family:var(--f-mono); font-size:10.5px}
.corr th{font-weight:500; color:var(--ink-3); padding:3px 4px; text-align:center; background:none; text-transform:none; letter-spacing:0; font-size:10px; border:none}

.dsel{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.dsel select, .dsel input{font:inherit; font-size:12.5px; color:var(--ink); background:var(--ground); border:1px solid var(--line); border-radius:var(--r-s); padding:6px 9px}
.dsel input{min-width:220px}
.maplay{display:grid; grid-template-columns:minmax(220px,1fr) minmax(200px,.9fr); gap:14px 18px; align-items:start}

.kmap svg{width:100%; height:auto; display:block; max-height:420px}

.kmap path.rg[data-q="0"]{fill:var(--nodata)} .kmap path.rg[data-q="1"]{fill:var(--seq1)} .kmap path.rg[data-q="2"]{fill:var(--seq2)}
.kmap path.rg[data-q="3"]{fill:var(--seq3)} .kmap path.rg[data-q="4"]{fill:var(--seq4)} .kmap path.rg[data-q="5"]{fill:var(--seq5)}

.themebtn{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-2); border:1px solid var(--line);

.toc{display:flex; flex-direction:column; gap:2px}

.reftools{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

.reftools input[type=search]{min-width:200px; flex:1}
.reflist{display:flex; flex-direction:column; gap:1px}

.tag.dupb{border-style:dashed; border-color:var(--warn-line); color:var(--warn)}
.tag.want{border-color:var(--warn-line); color:var(--warn); background:var(--warn-soft)}
/* 묶음별 보기 — 영역 머리와 묶음 머리 */
.grparea{font-size:var(--t-lab); font-weight:700; letter-spacing:.1em; color:var(--accent-ink);
  padding:14px 10px 4px; border-bottom:1px solid var(--accent-line); margin-top:6px}
.grparea:first-child{margin-top:0}
.grpbar{display:flex; flex-wrap:wrap; align-items:baseline; gap:3px 9px;
  padding:9px 10px; background:var(--surface-2); border-radius:var(--r-s); margin-top:8px}

.ref .racc{font-size:11px; color:var(--warn); line-height:1.45; text-align:right}
.rchk{display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-2);
  border:1px solid var(--line); border-radius:var(--r-s); padding:4px 8px; background:var(--ground); cursor:pointer; white-space:nowrap}
.rchk input{margin:0; accent-color:var(--accent)}
.ref .rside{display:flex; flex-direction:column; gap:5px}
.ref .rside select, .ref .rside input{font:inherit; font-size:11px; color:var(--ink); background:var(--ground); border:1px solid var(--line); border-radius:var(--r-s); padding:3px 5px; width:100%}
.ref .rside .del{font-size:10.5px; color:var(--ink-3); text-align:right}
.ref .rside .del:hover{color:var(--warn)}
.ref .rab{font-size:11.5px; color:var(--ink-3); margin-top:5px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}

/* ===================== 날짜 ===================== */
var DAY = 86400000, START = Date.UTC(2026, 8, 14);
function ymd(s){ var p = s.split("-"); return Date.UTC(+p[0], +p[1]-1, +p[2]); }
function todayUTC(){ var n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); }
function wkStart(i){ return START + (i-1)*7*DAY; }
function wkEnd(i){ return wkStart(i) + 6*DAY; }
function fmt(ms, y){ var d = new Date(ms);
  var m = String(d.getUTCMonth()+1).padStart(2,"0"), dd = String(d.getUTCDate()).padStart(2,"0");
  return y ? d.getUTCFullYear()+"."+m+"."+dd : m+"."+dd; }
function range(i){ return fmt(wkStart(i)) + "~" + fmt(wkEnd(i)); }
function dday(ms){ return Math.round((ms - todayUTC())/DAY); }
function monthKey(ms){ var d = new Date(ms); return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0"); }
function pad(n){ return String(n).padStart(2,"0"); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

var TODAY = todayUTC();
var CURW = Math.min(36, Math.max(1, Math.floor((TODAY - START)/(7*DAY)) + 1));
var BEFORE = TODAY < START, AFTER = TODAY > wkEnd(36);
var NOWW = BEFORE ? 1 : (AFTER ? 36 : CURW);

/* ===================== 상태 ===================== */
var LS = "phd-console-v1";
var state = { w:{}, m:{}, hab:{}, pre:{}, data:{todo:{}, note:""}, toc:{st:{}, pg:{}, note:{}}, refs:{items:[], st:{}, cite:{}, memo:{}, hide:{}, edit:{}} };
var selW = NOWW, habM = monthKey(TODAY), screen = "today";

function wk(i){
  if(!state.w[i]) state.w[i] = {t:[], h:null, ex:null, miss:"", next:"", memo:""};
  if(!Array.isArray(state.w[i].t)) state.w[i].t = [];
  return state.w[i];
}
function hab(k){ if(!state.hab[k]) state.hab[k] = {}; return state.hab[k]; }
function load(){
  try{ var r = localStorage.getItem(LS); if(r) apply(JSON.parse(r)); }
  catch(e){ flash("저장된 기록을 읽지 못했습니다"); }
}
function apply(d){
  if(!d || typeof d !== "object") return;
  ["w","m","hab","pre","data","toc","refs"].forEach(function(k){ if(d[k] && typeof d[k] === "object") state[k] = d[k]; });
  if(!state.data.todo) state.data.todo = {};
  ["st","pg","note"].forEach(function(k){ if(!state.toc[k]) state.toc[k] = {}; });
  ["st","cite","memo","hide","edit"].forEach(function(k){ if(!state.refs[k]) state.refs[k] = {}; }); if(!Array.isArray(state.refs.items)) state.refs.items = [];
}
var saveT = null;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(function(){
    try{ localStorage.setItem(LS, JSON.stringify(state)); setSave("저장됨 " + nowClock()); }
    catch(e){ setSave("저장 실패 — 저장 공간 확인"); }
  }, 250);
}
function nowClock(){ var d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function setSave(t){ var e = document.getElementById("saveTxt"); if(e) e.textContent = t; }

function wkDone(i){ var o = wk(i), n = WEEKS[i-1].t.length, c = 0;
  for(var j=0;j<n;j++) if(o.t[j]) c++; return {c:c, n:n}; }
function wkStatus(i){
  var d = wkDone(i);
  if(d.n && d.c === d.n) return "done";
  if(i === CURW && !BEFORE && !AFTER) return "now";
  if(wkEnd(i) < TODAY) return "late";
  return "soon";
}
function totals(){
  var tt = 0, td = 0, hrs = 0, logged = 0;
  for(var i=1;i<=36;i++){
    var d = wkDone(i); tt += d.n; td += d.c;
    var h = wk(i).h; if(h != null){ hrs += +h; logged++; }
  }
  return {tt:tt, td:td, pct: tt ? Math.round(td/tt*100) : 0, hrs:hrs, logged:logged};
}
function nextMeetWeek(){
  for(var i=1;i<=36;i++) if(WEEKS[i-1].adv && wkEnd(i) >= TODAY) return i;
  return null;
}

function go(name, push){
  if(!SCREENS[name]) name = "today";
  screen = name;
  if(push !== false && location.hash !== "#/" + name) location.hash = "#/" + name;
  document.getElementById("scTitle").textContent = SCREENS[name].title;
  Array.prototype.forEach.call(document.querySelectorAll(".navb"), function(b){
    if(b.dataset.go === name) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  document.getElementById("screen").innerHTML = SCREENS[name].render();
  wire();
  document.getElementById("screen").scrollIntoView({block:"start", behavior:"auto"});
  window.scrollTo(0,0);
  meta();
}
function meta(){
  var T = totals();
  document.getElementById("scMeta").innerHTML =
    "W" + pad(NOWW) + " / 36 · " + T.pct + "%<br>" + fmt(TODAY, true);
  document.getElementById("cntToday").textContent = "W" + pad(NOWW);
  document.getElementById("cntBoard").textContent = T.td + "/" + T.tt;
  document.getElementById("cntLog").textContent = T.hrs ? T.hrs.toFixed(0) + "h" : "";
  var cd = document.getElementById("cntData"); if(cd) cd.textContent = TD ? TD.meta.vars + "열" : "";
  var ct = document.getElementById("cntToc"); if(ct){ var T2 = tocTotals(); ct.textContent = T2.done + "/" + T2.n; }
  var cr = document.getElementById("cntRefs"); if(cr) cr.textContent = allRefs().length ? allRefs().length + "편" : "";
  var cp = document.getElementById("cntRep"); if(cp) cp.textContent = REPORT.ver;
  document.getElementById("rpR").textContent = "W" + pad(NOWW) + " · " + T.pct + "%";
  document.getElementById("rpBar").style.width = (NOWW/36*100) + "%";
}

  h += '<div class="board">';
  for(var mi=0; mi<MONTHS.length; mi++){
    var M = MONTHS[mi], rows = "", dc = 0, tc = 0;
    for(var i=1;i<=36;i++){
      if(WEEKS[i-1].m !== mi) continue;
      var W = WEEKS[i-1], st = wkStatus(i), d = wkDone(i);
      tc++; if(st === "done") dc++;
      var tags = (W.adv?'<span class="tag adv">면담</span>':"") + (W.key?'<span class="tag key">분기</span>':"") +

function countDone(){ var c = 0; for(var i=1;i<=36;i++) if(wkStatus(i)==="done") c++; return c; }

function hoursChart(){
  var W = 720, H = 190, ml = 34, mr = 8, mt = 12, mb = 26;
  var pw = W - ml - mr, ph = H - mt - mb;
  var max = 10;
  for(var i=1;i<=36;i++){ var v = +wk(i).h || 0; if(v > max) max = v; }
  max = Math.ceil(max/5)*5; if(max < 15) max = 15;
  var y = function(v){ return mt + ph - (v/max)*ph; };
  var bw = pw/36, bar = Math.max(6, bw - 4);

  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
    'aria-label="주차별 논문 투입 시간 막대 그래프. 목표는 주 10시간.">';
  for(var t=0; t<=max; t+=5){
    s += '<line x1="' + ml + '" y1="' + y(t) + '" x2="' + (W-mr) + '" y2="' + y(t) + '" stroke="var(--grid)" stroke-width="1"/>';
    s += '<text x="' + (ml-7) + '" y="' + (y(t)+3.5) + '" text-anchor="end">' + t + '</text>';
  }
  s += '<line x1="' + ml + '" y1="' + y(10) + '" x2="' + (W-mr) + '" y2="' + y(10) + '" stroke="var(--accent-line)" ' +
       'stroke-width="1.5" stroke-dasharray="5 4"/>';
  s += '<text x="' + (W-mr) + '" y="' + (y(10)-6) + '" text-anchor="end" class="axl">목표 10h</text>';

  for(var i=1;i<=36;i++){
    var v = +wk(i).h || 0;
    var x = ml + (i-1)*bw + (bw-bar)/2;
    if(v > 0){
      var hh = Math.max(3, (v/max)*ph), yy = y(v), r = Math.min(4, bar/2, hh);
      s += '<path d="M' + x + ' ' + (yy+hh) + ' V' + (yy+r) + ' a' + r + ' ' + r + ' 0 0 1 ' + r + ' -' + r +
           ' h' + (bar-2*r) + ' a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + r + ' V' + (yy+hh) + ' Z" ' +
           'fill="' + (v>=10 ? "var(--accent)" : "var(--warn)") + '"/>';
    }
    s += '<rect class="hit" data-w="' + i + '" data-v="' + v + '" x="' + (ml+(i-1)*bw) + '" y="' + mt + '" ' +
         'width="' + bw + '" height="' + ph + '" fill="transparent"/>';
    if(i % 4 === 0) s += '<text x="' + (ml+(i-1)*bw+bw/2) + '" y="' + (H-8) + '" text-anchor="middle">W' + pad(i) + '</text>';
  }
  s += '<line x1="' + ml + '" y1="' + y(0) + '" x2="' + (W-mr) + '" y2="' + y(0) + '" stroke="var(--line-strong)" stroke-width="1"/>';
  s += '</svg>';
  return s;
}

function dmuChart(){
  var Y = TD.meta.years, W = 720, H = 200, ml = 36, mr = 8, mt = 14, mb = 26, pw = W-ml-mr, ph = H-mt-mb;
  var max = 0; Y.forEach(function(y){ max = Math.max(max, TD.meta.panel_n[String(y)]); }); max = Math.ceil(max/50)*50;
  var y = function(v){ return mt + ph - v/max*ph; }, gw = pw/Y.length, bw = Math.max(5, (gw-10)/2);
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="연도별 패널 대학 수와 핵심·확장 모형 완결 대학 수">';
  for(var t=0;t<=max;t+=50){ s += '<line x1="' + ml + '" y1="' + y(t) + '" x2="' + (W-mr) + '" y2="' + y(t) + '" stroke="var(--grid)"/>' +
    '<text x="' + (ml-6) + '" y="' + (y(t)+3.5) + '" text-anchor="end">' + t + '</text>'; }
  Y.forEach(function(yr, i){
    var k = String(yr), pn = TD.meta.panel_n[k], c = TD.dea.complete[k];
    var x0 = ml + i*gw + 4;
    s += '<rect x="' + x0 + '" y="' + y(pn) + '" width="' + (gw-8) + '" height="' + (ph-(y(pn)-mt)) + '" fill="var(--surface-3)" rx="3"/>';
    s += '<rect x="' + (x0+1) + '" y="' + y(c.core) + '" width="' + bw + '" height="' + Math.max(0, ph-(y(c.core)-mt)) + '" fill="var(--accent)" rx="3"/>';
    s += '<rect x="' + (x0+bw+3) + '" y="' + y(c.ext) + '" width="' + bw + '" height="' + Math.max(0, ph-(y(c.ext)-mt)) + '" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.2" rx="3"/>';
    s += '<rect class="hit" data-y="' + k + '" x="' + (ml+i*gw) + '" y="' + mt + '" width="' + gw + '" height="' + ph + '" fill="transparent"/>';
    s += '<text x="' + (ml+i*gw+gw/2) + '" y="' + (H-8) + '" text-anchor="middle">' + String(yr).slice(2) + '</text>';
  });

function corrTable(){

function sidoMap(){

  var qv = function(v){ if(v === null || !sorted.length) return 0; var r = sorted.filter(function(x){ return x <= v; }).length / sorted.length; return r >= .8 ? 5 : r >= .6 ? 4 : r >= .4 ? 3 : r >= .2 ? 2 : 1; };

function md(){
  var W = WEEKS[selW-1], o = wk(selW), L = [];
  L.push("# 주간 회고 — W" + pad(selW) + " (" + fmt(wkStart(selW), true) + " ~ " + fmt(wkEnd(selW), true) + ")", "");
  L.push("## 이번 주 계획");
  W.t.forEach(function(t, j){ L.push("- [" + (o.t[j]?"x":" ") + "] " + t); });
  L.push("- 남는 것: " + W.o, "");
  L.push("## 실제 투입 시간");
  L.push("- 논문: " + (o.h==null?"__":o.h) + " h / 10 h", "");
  L.push("## 완료한 것");
  var done = W.t.filter(function(t, j){ return o.t[j]; });
  if(done.length) done.forEach(function(t){ L.push("- " + t); }); else L.push("- ");
  L.push("", "## 못 한 것 · 이유", "- " + (o.miss||""), "");
  L.push("## 다음 주로 넘기는 것", "- " + (o.next||""), "");
  L.push("## 건강 · 관계 · 재무 체크");
  L.push("- 운동 " + (o.ex==null?"__":o.ex) + " / 3회");
  var H = hab(monthKey(wkStart(selW)));
  HABITS.forEach(function(h){ L.push("- " + h.t + ": " + (H[h.k]?"☑":"☐")); });
  L.push("", "## 한 줄 메모", o.memo||"", "");
  return L.join("\n");
}
function download(name, text, type){
  var b = new Blob([text], {type: type + ";charset=utf-8"});
  var u = URL.createObjectURL(b), a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(u); }, 1500);
}
function act(what){
  if(what === "dl-md"){ download("W" + pad(selW) + "-회고.md", md(), "text/markdown"); flash("내려받았습니다"); }
  else if(what === "copy-md"){
    var text = md();
    if(navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(function(){ flash("복사했습니다"); }, function(){ fallbackCopy(text); });
    else fallbackCopy(text);
  }
  else if(what === "backup"){
    var stamp = fmt(TODAY, true).replace(/\./g,"");
    download("phd-console-" + stamp + ".json", JSON.stringify(state, null, 2), "application/json");
    flash("내려받았습니다", "actMsg2");
  }
  else if(what === "restore"){ document.getElementById("fileIn").click(); }
  else if(what === "toc-md"){ download("논문목차-진행-" + fmt(TODAY, true).replace(/\./g, "") + ".md", tocMd(), "text/markdown"); flash("내려받았습니다"); }
  else if(what === "refs-csv"){ download("문헌목록.csv", refsCsv(), "text/csv"); flash("내려받았습니다"); }
  else if(what === "refs-bib"){ download("문헌목록.bib", refsBib(), "application/x-bibtex"); flash("내려받았습니다"); }
  else if(what === "refs-txt"){ download("참고문헌.txt", refsTxt(), "text/plain"); flash("내려받았습니다"); }
  else if(what === "refs-import"){ document.getElementById("refFile").click(); }
  else if(what === "doi-lookup"){ doiLookup(); }
  else if(what === "ref-add"){ refAdd(); }
}
function fallbackCopy(text){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  var ok = false; try{ ok = document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  flash(ok ? "복사했습니다" : "복사가 막혔습니다 — 내려받기를 쓰세요");
}
